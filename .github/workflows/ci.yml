# Checks every push and pull request: known vulnerabilities in dependencies, code style, static analysis, the build,
# and all PHP and JavaScript tests. Secrets are not needed: tests fake Mollie, Mistral and mail.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword" --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, gd, intl, pdo_mysql, sodium, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit PHP dependencies for known vulnerabilities
        run: composer audit --no-interaction

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit JavaScript dependencies for known vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse app --memory-limit=1G --no-progress

      - name: PHP tests
        run: php artisan test --parallel

      - name: JavaScript tests
        run: node --test 'tests/js/**/*.test.mjs' 'tests/JavaScript/**/*.test.cjs'
